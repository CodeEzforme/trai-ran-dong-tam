name: Publish Dong Tam website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install build requirements
        run: python -m pip install -r requirements.txt
      - name: Build all existing routes
        run: python scripts/build.py
      - name: Verify routes and links
        run: python scripts/check.py
      - name: Prepare repository URL paths
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: python scripts/prepare-pages.py --base-path "$PAGES_BASE_PATH"
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: artifacts/github-pages-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v5
